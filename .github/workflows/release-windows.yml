name: Release Flow for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify packaged source
        shell: powershell
        run: |
          Select-String -Path server.js -Pattern "flow-ai-7181.onrender.com" -SimpleMatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Verify packaged app contains AI backend URL
        shell: powershell
        run: |
          npx asar extract dist/win-unpacked/resources/app.asar dist/asar-check
          Select-String -Path dist/asar-check/server.js -Pattern "flow-ai-7181.onrender.com" -SimpleMatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show build output
        shell: powershell
        run: Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Create or update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
          }
          $releaseExists = gh release list --limit 100 --json tagName --jq ".[] | select(.tagName == `"$tag`") | .tagName"
          if (-not $releaseExists) {
            gh release create $tag --title $version --notes "Flow $version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist/Flow Setup $version.exe" "dist/Flow Setup $version.exe.blockmap" "dist/latest.yml" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

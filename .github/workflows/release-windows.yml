name: Release Flow for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Show build output
        shell: powershell
        run: Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Upload installer to existing v1.3.7 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.3.7 "dist/Flow Setup 1.3.7.exe" "dist/Flow Setup 1.3.7.exe.blockmap" "dist/latest.yml" --clobber

name: Release Flow for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: flow-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify packaged source
        shell: powershell
        run: |
          Select-String -Path server.js -Pattern "flow-ai-v2.onrender.com" -SimpleMatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Verify packaged app contains AI backend URL
        shell: powershell
        run: |
          npx asar extract dist/win-unpacked/resources/app.asar dist/asar-check
          Select-String -Path dist/asar-check/server.js -Pattern "flow-ai-v2.onrender.com" -SimpleMatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show build output
        shell: powershell
        run: Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Create or update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
          }
          if ((git rev-list -n 1 $tag) -ne (git rev-parse HEAD)) { throw "Tag points to another commit" }
          $releaseExists = gh release list --limit 100 --json tagName --jq ".[] | select(.tagName == `"$tag`") | .tagName"
          if (-not $releaseExists) {
            gh release create $tag --draft --title "Flow $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist/Flow-Setup-$version.exe" "dist/Flow-Setup-$version.exe.blockmap" "dist/latest.yml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Release Flow for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Show build output
        shell: powershell
        run: Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Create or update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $version --notes "Flow $version"
          }
          gh release upload $tag "dist/Flow Setup $version.exe" "dist/Flow Setup $version.exe.blockmap" "dist/latest.yml" --clobber
